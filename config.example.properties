# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…); LG and Samsung: en, es, pt, ru
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
currency=USD

# An RSS feed for the News card in the bottom drawer (it takes the crypto card's place; the prices stay at the top
# of the home screen). Empty = no News card. E.g. https://ct24.ceskatelevize.cz/rss/hlavni-zpravy
news_rss=

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false
